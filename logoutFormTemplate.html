<form method="post">
	<fieldset>
	<legend>Logged in user</legend> <!--Logout form-->
	<div>
		<label for="styleselect">Style:</label>
		<select name="style" id="styleselect" onchange='this.form.submit()'>
			<option [+plainSelected+] value="plain">Plain theme</option>
			<option [+lightSelected+] value="light">Light theme</option>
			<option [+darkSelected+] value="dark">Dark theme</option>
		</select>
		<label>[+loggedInName+] is logged in. </label>
		<input type="submit" name="logout" value="logout">
	</div>
	</fieldset>
</form>
